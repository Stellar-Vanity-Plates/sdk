name: SDK checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.6
      - run: deno task check
      - run: deno task docs
      - run: deno task test
      - name: Verify generated ABI types
        run: |
          deno task generate
          git diff --exit-code -- src/contracts/generated
      - name: Verify canonical style generation
        run: |
          deno task generate:styles
          git diff --exit-code -- src/rendering/vendor/plate-styles.ts
      - run: deno run -A npm:playwright@1.61.0 install --with-deps chromium
      - run: deno task test:browser
      - name: Attach failing visual comparisons
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-parity-failures
          path: output/parity/
          if-no-files-found: ignore
          retention-days: 7
      - run: deno task build:preview
